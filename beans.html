<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Beans Game | Rishi Iyer</title>
	<style>
		:root { color-scheme: dark; --ink: #f4f1e8; --muted: rgba(244, 241, 232, .54); }
		* { box-sizing: border-box; }
		html, body { min-height: 100%; margin: 0; background: #030303; }
		body { color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
		.page { position: relative; min-height: 100vh; overflow: hidden; padding: 2rem clamp(1.5rem, 7vw, 7rem); background: #030303; }
		canvas, .flow-wash { position: absolute; inset: 0; width: 100%; height: 100%; }
		canvas { display: block; }
		.flow-wash { pointer-events: none; background: radial-gradient(circle at 50% 48%, transparent 0 18%, rgba(3, 3, 3, .08) 66%, rgba(3, 3, 3, .68) 100%), linear-gradient(90deg, rgba(3, 3, 3, .62), transparent 34%, transparent 66%, rgba(3, 3, 3, .62)); }
		nav, .content { position: relative; z-index: 1; }
		nav { display: flex; justify-content: center; gap: clamp(1.1rem, 3vw, 2.8rem); margin-bottom: 2rem; }
		nav a { color: var(--muted); font: .62rem Arial, sans-serif; letter-spacing: .16em; text-decoration: none; text-transform: uppercase; }
		nav a:hover, nav a:focus-visible { color: var(--ink); }
		.content { max-width: 50rem; }
		.eyebrow { color: var(--muted); font: .66rem Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
		h1 { margin: 1rem 0 1.5rem; font-size: clamp(3.5rem, 9vw, 7rem); font-weight: 400; letter-spacing: -.055em; line-height: .86; }
		p { color: var(--muted); font: .85rem/1.8 Arial, sans-serif; margin: 0 0 1.5rem 0; }
		#gameCanvas { display: block; margin: 2rem 0; border: 2px solid var(--ink); background: linear-gradient(135deg, #d2d2d2 0%, #e8e8e8 100%); max-width: 100%; height: auto; }
		.controls { color: var(--muted); font: .76rem Arial, sans-serif; line-height: 1.7; margin-bottom: 2rem; }
		.controls strong { color: var(--ink); }
	</style>
</head>
<body>
	<div class="page">
		<nav aria-label="Primary navigation">
			<a href="index.html">Home</a>
			<a href="about.html">About</a>
			<a href="projects.html">Projects</a>
			<a href="contact.html">Contact</a>
		</nav>
		<div class="content">
			<div class="eyebrow">Play Now</div>
			<h1>Beans</h1>
			<p>Collect beans, avoid bombs, and beat the clock. How high can you score in 45 seconds?</p>
			<canvas id="gameCanvas" width="800" height="600"></canvas>
			<div class="controls">
				<p><strong>Controls:</strong></p>
				<p>Move: WASD or Arrow Keys<br>Restart: Enter<br>Quit: ESC</p>
				<p><strong>Goal:</strong> Collect 30 beans before time runs out. Watch out for bombs!</p>
			</div>
		</div>
	</div>
	<script src="beans-game.js"></script>
</body>
</html>
