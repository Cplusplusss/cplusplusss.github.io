<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Projects | Rishi Iyer</title>
	<style>
		:root { color-scheme: dark; --ink: #f4f1e8; --muted: rgba(244, 241, 232, .54); --line: rgba(244, 241, 232, .14); }
		* { box-sizing: border-box; }
		html, body { min-height: 100%; margin: 0; background: #030303; }
		body { color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
		.page { position: relative; min-height: 100vh; overflow: hidden; padding: 2rem clamp(1.5rem, 7vw, 7rem); background: #030303; }
		canvas, .flow-wash { position: absolute; inset: 0; width: 100%; height: 100%; }
		canvas { display: block; }
		.flow-wash { pointer-events: none; background: radial-gradient(circle at 50% 48%, transparent 0 18%, rgba(3, 3, 3, .08) 66%, rgba(3, 3, 3, .68) 100%), linear-gradient(90deg, rgba(3, 3, 3, .62), transparent 34%, transparent 66%, rgba(3, 3, 3, .62)); }
		nav, main { position: relative; z-index: 1; }
		nav { display: flex; justify-content: center; gap: clamp(1.1rem, 3vw, 2.8rem); }
		nav a { color: var(--muted); font: .62rem Arial, sans-serif; letter-spacing: .16em; text-decoration: none; text-transform: uppercase; }
		nav a:hover, nav a:focus-visible { color: var(--ink); }
		main { max-width: 48rem; margin-top: clamp(8rem, 20vh, 13rem); }
		.eyebrow { color: var(--muted); font: .66rem Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
		h1 { margin: 1rem 0 3rem; font-size: clamp(3.5rem, 9vw, 7rem); font-weight: 400; letter-spacing: -.055em; line-height: .86; }
		.project { display: flex; justify-content: space-between; gap: 2rem; padding: 1.2rem 0; border-top: 1px solid var(--line); font: .76rem Arial, sans-serif; }
		.project span:last-child { color: var(--muted); }
	</style>
</head>
<body>
	<div class="page">
		<canvas id="flow" aria-hidden="true"></canvas><div class="flow-wash" aria-hidden="true"></div>
		<nav aria-label="Primary navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav>
		<main><div class="eyebrow">All of my Finished and Unfinished Projects</div><h1>Projects</h1><div class="project"><span>Beans</span><span>Beans is a game about strategy and timing, you have to collect 30 beans on a 30 second time limit</span></div><div class="project"><span>Moving-Bougt</span><span>2026</span></div></main>
	</div>
	<script src="flow.js"></script>
</body>
</html>
