<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="theme-color" content="#030303" />
	<title>Flow</title>
	<style>
		:root {
			color-scheme: dark;
			--ink: #f4f1e8;
			--muted: rgba(244, 241, 232, 0.54);
			--line: rgba(244, 241, 232, 0.14);
		}

		* { box-sizing: border-box; }

		html, body {
			width: 100%;
			min-height: 100%;
			margin: 0;
			overflow: hidden;
			background: #030303;
		}

		body {
			color: var(--ink);
			font-family: Georgia, 'Times New Roman', serif;
		}

		.stage {
			position: relative;
			width: 100vw;
			height: 100vh;
			isolation: isolate;
			background: #030303;
		}

		canvas {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			display: block;
		}

		.wash {
			position: absolute;
			inset: 0;
			z-index: 1;
			pointer-events: none;
			background:
				radial-gradient(circle at 50% 48%, transparent 0 18%, rgba(3, 3, 3, 0.08) 66%, rgba(3, 3, 3, 0.68) 100%),
				linear-gradient(90deg, rgba(3, 3, 3, 0.62), transparent 34%, transparent 66%, rgba(3, 3, 3, 0.62));
		}

		.intro {
			position: absolute;
			z-index: 2;
			left: clamp(1.5rem, 7vw, 7rem);
			bottom: clamp(2.2rem, 9vh, 7rem);
			width: calc(100vw - 3rem);
			max-width: 30rem;
			animation: arrive 1.4s cubic-bezier(.2, .8, .2, 1) both;
		}

		.eyebrow {
			display: flex;
			align-items: center;
			gap: 0.7rem;
			margin-bottom: 1.2rem;
			color: var(--muted);
			font-family: Arial, sans-serif;
			font-size: 0.66rem;
			letter-spacing: 0.18em;
			text-transform: uppercase;
		}

		.eyebrow::before {
			content: '';
			width: 2.8rem;
			height: 1px;
			background: var(--line);
		}

		h1 {
			margin: 0;
			font-size: clamp(3.8rem, 10vw, 9rem);
			font-weight: 400;
			white-space: nowrap;
			letter-spacing: -0.055em;
			line-height: 0.82;
		}

		.description {
			max-width: 19rem;
			margin: 1.7rem 0 0 0.25rem;
			color: var(--muted);
			font-family: Arial, sans-serif;
			font-size: 0.73rem;
			letter-spacing: 0.04em;
			line-height: 1.6;
		}

		.status {
			position: absolute;
			z-index: 2;
			top: 2rem;
			right: clamp(1.5rem, 5vw, 5rem);
			display: flex;
			align-items: center;
			gap: 0.55rem;
			color: var(--muted);
			font-family: Arial, sans-serif;
			font-size: 0.62rem;
			letter-spacing: 0.16em;
			text-transform: uppercase;
		}

		.navigation {
			position: absolute;
			top: 1.85rem;
			left: 50%;
			z-index: 2;
			display: flex;
			gap: clamp(1.1rem, 3vw, 2.8rem);
			transform: translateX(-50%);
		}

		.navigation a {
			position: relative;
			padding: 0.25rem 0;
			color: var(--muted);
			font-family: Arial, sans-serif;
			font-size: 0.62rem;
			letter-spacing: 0.16em;
			text-decoration: none;
			text-transform: uppercase;
			transition: color 180ms ease;
		}

		.navigation a::after {
			position: absolute;
			right: 0;
			bottom: -0.35rem;
			left: 0;
			height: 1px;
			background: var(--ink);
			content: '';
			transform: scaleX(0);
			transform-origin: right;
			transition: transform 180ms ease;
		}

		.navigation a:hover,
		.navigation a:focus-visible {
			color: var(--ink);
		}

		.navigation a:hover::after,
		.navigation a:focus-visible::after {
			transform: scaleX(1);
			transform-origin: left;
		}

		.status::before {
			content: '';
			width: 0.42rem;
			height: 0.42rem;
			border-radius: 50%;
			background: #d8d2bf;
			box-shadow: 0 0 0.8rem rgba(216, 210, 191, 0.8);
		}

		@keyframes arrive {
			from { opacity: 0; transform: translateY(1.2rem); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (prefers-reduced-motion: reduce) {
			.intro { animation: none; }
		}
	</style>
</head>
<body>
	<main class="stage" aria-label="A continuously moving flow field">
		<canvas id="flow" aria-hidden="true"></canvas>
		<div class="wash" aria-hidden="true"></div>
		<nav class="navigation" aria-label="Primary navigation">
			<a href="about.html">About</a>
			<a href="projects.html">Projects</a>
			<a href="contact.html">Contact</a>
		</nav>
		<div class="status">4 months of experience</div>
		<section class="intro">
			<div class="eyebrow">Game and Software developer</div>
			<h1>Rishi Iyer</h1>
			<p class="description">A learning developer</p>
		</section>
	</main>

	<script>
		const canvas = document.getElementById('flow');
		const context = canvas.getContext('2d');
		const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
		let width = 0;
		let height = 0;
		let particles = [];
		let animationFrame;
		let time = 0;

		function resize() {
			const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
			width = window.innerWidth;
			height = window.innerHeight;
			canvas.width = width * pixelRatio;
			canvas.height = height * pixelRatio;
			context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
			createParticles();
		}

		function createParticles() {
			const count = Math.min(1100, Math.max(380, Math.floor((width * height) / 1700)));
			particles = Array.from({ length: count }, () => ({
				x: Math.random() * width,
				y: Math.random() * height,
				life: Math.random() * 160,
				maxLife: 80 + Math.random() * 220,
				speed: 0.35 + Math.random() * 0.8,
				width: 0.25 + Math.random() * 1.1,
				alpha: 0.06 + Math.random() * 0.24,
				warm: Math.random() > 0.78
			}));
		}

		function fieldAngle(x, y, currentTime) {
			const scale = 0.0018;
			const waves = Math.sin(x * scale + currentTime * 0.00025) * 1.4
				+ Math.cos(y * scale * 1.35 - currentTime * 0.00018) * 1.1
				+ Math.sin((x + y) * scale * 0.65 + currentTime * 0.00016) * 0.8;
			return waves + Math.sin(y * 0.004 + currentTime * 0.00035) * 0.25;
		}

		function draw() {
			context.fillStyle = 'rgba(3, 3, 3, 0.075)';
			context.fillRect(0, 0, width, height);
			context.globalCompositeOperation = 'screen';

			for (const particle of particles) {
				const previousX = particle.x;
				const previousY = particle.y;
				const angle = fieldAngle(particle.x, particle.y, time);
				particle.x += Math.cos(angle) * particle.speed;
				particle.y += Math.sin(angle) * particle.speed;
				particle.life += 1;

				const fade = Math.min(1, particle.life / 24, (particle.maxLife - particle.life) / 38);
				if (particle.life > particle.maxLife || particle.x < -30 || particle.x > width + 30 || particle.y < -30 || particle.y > height + 30) {
					particle.x = Math.random() * width;
					particle.y = Math.random() * height;
					particle.life = 0;
				}

				context.beginPath();
				context.moveTo(previousX, previousY);
				context.lineTo(particle.x, particle.y);
				context.strokeStyle = particle.warm
					? `rgba(220, 203, 164, ${particle.alpha * fade})`
					: `rgba(221, 226, 220, ${particle.alpha * fade})`;
				context.lineWidth = particle.width;
				context.stroke();
			}

			context.globalCompositeOperation = 'source-over';
			time += reducedMotion.matches ? 0 : 16;
			animationFrame = requestAnimationFrame(draw);
		}

		window.addEventListener('resize', resize, { passive: true });
		resize();
		draw();
	</script>
</body>
</html>
